// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    maven {
      url "$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo"
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

subprojects {
    if (project.projectDir.absolutePath.contains("node_modules")) {
        plugins.withId('com.android.library') {
            project.android.externalNativeBuild.cmake {
                buildStagingDirectory = new File(rootProject.projectDir, ".cxx/${project.name}")
            }
        }
    }
}




